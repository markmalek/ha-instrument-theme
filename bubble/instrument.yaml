instrument:
  name: "Instrument"
  version: "1.0.0"
  creator: "markmalek"
  link: "https://github.com/markmalek/ha-instrument-theme"
  # Applies to every Bubble card. Set it to false and list `instrument` in a card's
  # `modules:` to use it on some cards only.
  is_global: true
  supported:
    - button
    - media-player
    - select
    - separator
    - pop-up
    - climate
    - cover
  description: |
    Draws Bubble Card the Instrument way, on top of the Instrument theme:
    tinted "on" buttons and slider fills with a bright edge, a tinted icon
    tile, mono state text, and quiet mono separators. Every Instrument colour
    falls back to a Home Assistant one, so a card under another theme keeps
    readable colours.
  code: |
    /* Inter and JetBrains Mono inside the card, even on a single themed view. */
    .bubble-container {
      font-family: var(--ha-font-family-body, inherit);
    }

    /* "On": Bubble fills the button with the accent, or a light with its own
       colour; draw that as a 16% tint instead of solid. The accent is set
       on ha-card so it beats modules that point it back at primary-color. */
    ha-card {
      --bubble-button-accent-color: var(--instrument-ac, var(--primary-color));
    }
    /* Bubble picks a sub-button's text from the raw fill (dark text on a bright
       one, white on a dark one), but every fill here is drawn as a quiet tint,
       so both tones take the theme's text colour. On :host, so pop-ups (which
       have no ha-card) get it too; a pop-up's own "on" header keeps the
       theme's bubble-button-accent-color tint. */
    :host {
      --bubble-sub-button-dark-text-color: var(--primary-text-color);
      --bubble-sub-button-light-text-color: var(--primary-text-color);
    }
    ha-card.is-on .bubble-button-background {
      background-color: color-mix(in srgb, var(--bubble-button-background-color, var(--instrument-ac, var(--primary-color))) 16%, transparent) !important;
      opacity: 1 !important;
    }
    .bubble-sub-button.background-on:not(.is-select) {
      background-color: color-mix(in srgb, var(--bubble-sub-button-light-background-color, var(--instrument-ac, var(--primary-color))) 16%, transparent) !important;
    }
    ha-card.is-on .bubble-container {
      border-color: color-mix(in srgb, var(--instrument-ac, var(--primary-color)) 26%, var(--instrument-line, var(--divider-color))) !important;
    }

    /* Slider fill: the light's colour (or the accent) at 16%, with a bright edge. */
    .bubble-range-slider .bubble-range-fill {
      --bubble-accent-color: var(--instrument-ac, var(--primary-color));
      background-color: color-mix(in srgb, var(--bubble-slider-fill-color, var(--instrument-ac, var(--primary-color))) 16%, transparent) !important;
      opacity: 1 !important;
    }
    .bubble-range-slider .bubble-range-fill.fill-orientation-left {
      box-shadow: inset -2px 0 0 color-mix(in srgb, var(--bubble-slider-fill-color, var(--instrument-ac, var(--primary-color))) 75%, white);
    }

    /* Icon tile: tinted with the icon's own colour when on. */
    ha-card.is-on .bubble-icon-container {
      background-color: color-mix(in srgb, currentColor 18%, var(--instrument-card, var(--card-background-color))) !important;
      box-shadow: 0 0 14px color-mix(in srgb, currentColor 30%, transparent);
    }
    ha-card.is-on .bubble-icon-container::before {
      opacity: 0 !important;
    }

    /* State line: mono, bright when on. */
    .bubble-name-container .bubble-state {
      font-family: var(--ha-font-family-code, monospace);
      font-size: 11.5px;
      letter-spacing: 0.02em;
      color: var(--instrument-faint, var(--secondary-text-color));
    }
    ha-card.is-on .bubble-name-container .bubble-state {
      color: var(--instrument-hi, var(--primary-color));
    }

    /* Separator: a small uppercase mono label on a 1px line. */
    .bubble-separator .bubble-name {
      font-family: var(--ha-font-family-code, monospace) !important;
      font-size: 11px !important;
      font-weight: 500 !important;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--instrument-muted, var(--secondary-text-color)) !important;
    }
    .bubble-separator .bubble-icon {
      color: var(--instrument-muted, var(--secondary-text-color));
      --mdc-icon-size: 16px;
    }
    .bubble-separator .bubble-line {
      background-color: var(--instrument-line, var(--divider-color)) !important;
      height: 1px !important;
      opacity: 1 !important;
    }
